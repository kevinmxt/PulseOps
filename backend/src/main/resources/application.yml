spring:
  application:
    name: pulseops
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pulseops}
    username: ${DB_USERNAME:pulseops}
    password: ${DB_PASSWORD:pulseops}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

pulseops:
  probe:
    tick-interval: 1s
    batch-size: 200
    pool-size: 8
    queue-capacity: 100
    scheduling-enabled: true

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
