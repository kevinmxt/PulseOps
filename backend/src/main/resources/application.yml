spring:
  application:
    name: pulseops
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pulseops}
    username: ${DB_USERNAME:pulseops}
    password: ${DB_PASSWORD:pulseops}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

pulseops:
  probe:
    tick-interval: 1s
    batch-size: 200
    pool-size: 8
    queue-capacity: 100
    scheduling-enabled: true
  heartbeat:
    require-https: ${HEARTBEAT_REQUIRE_HTTPS:false}
    tick-interval: 5s
    batch-size: 100
    scheduling-enabled: true
  cleanup:
    enabled: true
    scheduling-enabled: true
    tick-interval: 1h
    check-result-retention-days: 30
    resolved-incident-retention-days: 90
    batch-size: 1000
    max-batches-per-tick: 50
  auth:
    cookie-secure: ${PULSEOPS_AUTH_COOKIE_SECURE:false}
    bootstrap-username: ${PULSEOPS_AUTH_BOOTSTRAP_USERNAME:}
    bootstrap-password-hash: ${PULSEOPS_AUTH_BOOTSTRAP_PASSWORD_HASH:}

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: PULSEOPS_SESSION
        http-only: true
        same-site: lax
        path: /
        secure: ${pulseops.auth.cookie-secure:false}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
